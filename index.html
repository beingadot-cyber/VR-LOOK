<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luxe Jewels | Virtual Try-On</title>
<style>
:root{--gold:#b8893b;--ink:#1c1917;--bg:#faf7f2}
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,serif;background:var(--bg);color:var(--ink)}
header{padding:20px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #e7dfd0}
header h1{font-size:24px;letter-spacing:3px;color:var(--gold)}
main{padding:40px 5%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.card{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:170px;object-fit:contain;background:#f3ede1;border-radius:10px}
.card h3{margin:12px 0 4px;font-size:17px}.card p{color:var(--gold);margin-bottom:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:30px;padding:10px 18px;margin:3px}
.try{background:var(--gold);color:#fff}.buy{background:var(--ink);color:#fff}
#modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9}
#modal.on{display:grid}
.box{position:relative;width:min(92vw,720px);background:#000;border-radius:14px;overflow:hidden}
.stage{position:relative;aspect-ratio:4/3}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#msg{position:absolute;top:10px;left:10px;color:#fff;background:#0009;padding:6px 12px;border-radius:20px;font:13px sans-serif}
#close{position:absolute;top:8px;right:8px;background:#fff;z-index:2}
.bar{background:#111;color:#fff;padding:12px;text-align:center}
</style></head><body>
<header><h1>LUXE JEWELS</h1><span>Cart (0)</span></header>
<main><h2 style="margin-bottom:20px">New Collection</h2><div class="grid" id="grid"></div></main>

<div id="modal"><div class="box">
  <button id="close">✕ Close</button>
  <div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas><div id="msg">Loading…</div></div>
  <div class="bar" id="pname"></div>
</div></div>

<script type="module">
import {FilesetResolver,FaceLandmarker,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ====== 1. YOUR PRODUCTS — replace img with the client's TRANSPARENT PNG ======
   type: "earring" | "necklace" | "ring" | "bracelet"                        */
const svg=s=>"data:image/svg+xml;utf8,"+encodeURIComponent(s);
const gold='#d4a63f';
const PRODUCTS=[
 {id:1,type:"earring",name:"Gold Drop Earrings",price:"₹4,999",
  img:svg(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="220"><circle cx="50" cy="12" r="8" fill="${gold}"/><rect x="48" y="18" width="4" height="40" fill="${gold}"/><path d="M50 58 L85 120 L50 205 L15 120Z" fill="${gold}" stroke="#8a6416" stroke-width="3"/><path d="M50 70 L70 120 L50 180 L30 120Z" fill="#fff6" /></svg>`)},
 {id:2,type:"necklace",name:"Pendant Necklace",price:"₹8,499",
  img:svg(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260"><path d="M10 0 Q200 230 390 0" fill="none" stroke="${gold}" stroke-width="6"/><path d="M200 175 L225 205 L200 245 L175 205Z" fill="#c0262d" stroke="${gold}" stroke-width="5"/></svg>`)},
 {id:3,type:"ring",name:"Solitaire Ring",price:"₹12,999",
  img:svg(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="90"><rect x="0" y="45" width="200" height="30" rx="8" fill="${gold}"/><path d="M80 45 L100 8 L120 45Z" fill="#bfe9ff" stroke="#fff" stroke-width="3"/></svg>`)},
 {id:4,type:"bracelet",name:"Gold Bangle",price:"₹15,499",
  img:svg(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="70"><rect x="0" y="10" width="300" height="50" rx="22" fill="${gold}" stroke="#8a6416" stroke-width="4"/><rect x="0" y="22" width="300" height="8" fill="#fff4"/></svg>`)}
];

/* ====== 2. STORE GRID ====== */
const $=id=>document.getElementById(id);
$("grid").innerHTML=PRODUCTS.map(p=>`<div class="card"><img src="${p.img}" alt="${p.name}"><h3>${p.name}</h3><p>${p.price}</p>
<button class="try" data-id="${p.id}">✨ Try On</button><button class="buy">Add to Cart</button></div>`).join("");
document.querySelectorAll(".try").forEach(b=>b.onclick=()=>openTry(PRODUCTS.find(p=>p.id==b.dataset.id)));

/* ====== 3. TRY-ON ENGINE ====== */
let face,hand,stream,running=false,cur,curImg;
const v=$("v"),c=$("c"),ctx=c.getContext("2d"),msg=$("msg");
const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const M="https://storage.googleapis.com/mediapipe-models/";
let fileset;
async function load(kind){
  fileset=fileset||await FilesetResolver.forVisionTasks(WASM);
  if(kind==="face"&&!face) face=await FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:M+"face_landmarker/face_landmarker/float16/1/face_landmarker.task"},runningMode:"VIDEO",numFaces:1});
  if(kind==="hand"&&!hand) hand=await HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:M+"hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},runningMode:"VIDEO",numHands:1});
}
async function openTry(p){
  cur=p;curImg=new Image();curImg.src=p.img;
  $("modal").classList.add("on");$("pname").textContent=p.name+" — "+p.price;msg.textContent="Loading AI model…";
  try{
    await load(p.type==="earring"||p.type==="necklace"?"face":"hand");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:1280,height:960}});
    v.srcObject=stream;await v.play();
    c.width=v.videoWidth;c.height=v.videoHeight;running=true;
    msg.textContent=p.type==="earring"||p.type==="necklace"?"Look at the camera":"Show your hand, palm facing camera";
    loop();
  }catch(e){msg.textContent="Camera blocked or unsupported. Allow camera access (site must be HTTPS).";console.error(e)}
}
$("close").onclick=()=>{running=false;stream&&stream.getTracks().forEach(t=>t.stop());$("modal").classList.remove("on")};

const P=(l,W,H)=>({x:l.x*W,y:l.y*H});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function draw(img,x,y,w,ang,anchorTop){ // anchorTop: x,y is top-centre; else centre
  const h=w*img.naturalHeight/img.naturalWidth;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.drawImage(img,-w/2,anchorTop?0:-h/2,w,h);ctx.restore();
}
let last=-1;
function loop(){
  if(!running)return;
  if(v.currentTime!==last){
    last=v.currentTime;const W=c.width,H=c.height,t=performance.now();
    ctx.clearRect(0,0,W,H);
    if(cur.type==="earring"||cur.type==="necklace"){
      const r=face.detectForVideo(v,t);
      if(r.faceLandmarks.length){
        const L=r.faceLandmarks[0],a=P(L[234],W,H),b=P(L[454],W,H),chin=P(L[152],W,H),top=P(L[10],W,H);
        const fw=dist(a,b),fh=dist(top,chin),roll=Math.atan2(b.y-a.y,b.x-a.x);
        const dx=(chin.x-top.x)/fh,dy=(chin.y-top.y)/fh; // "down" direction of the face
        if(cur.type==="earring"){
          const w=fw*0.14;
          [a,b].forEach(p=>draw(curImg,p.x+dx*fh*0.12,p.y+dy*fh*0.12,w,roll,true));
        }else{
          draw(curImg,chin.x+dx*fh*0.30,chin.y+dy*fh*0.30,fw*1.05,roll,true);
        }
        msg.style.display="none";
      }else{msg.style.display="block";msg.textContent="Face not found"}
    }else{
      const r=hand.detectForVideo(v,t);
      if(r.landmarks.length){
        const L=r.landmarks[0].map(l=>P(l,W,H));
        if(cur.type==="ring"){
          const a=L[13],b=L[14],m={x:a.x+(b.x-a.x)*0.45,y:a.y+(b.y-a.y)*0.45};
          draw(curImg,m.x,m.y,dist(L[5],L[9])*0.95,Math.atan2(b.y-a.y,b.x-a.x)-Math.PI/2,false);
        }else{
          const w0=L[0],f=L[9],m={x:w0.x+(f.x-w0.x)*0.10,y:w0.y+(f.y-w0.y)*0.10};
          draw(curImg,m.x,m.y,dist(L[5],L[17])*1.25,Math.atan2(f.y-w0.y,f.x-w0.x)-Math.PI/2,false);
        }
        msg.style.display="none";
      }else{msg.style.display="block";msg.textContent="Show your hand"}
    }
  }
  requestAnimationFrame(loop);
}
</script></body></html>
